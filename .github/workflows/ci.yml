name: Java CI with Maven (Matrix + JaCoCo + Cache)

# Kích hoạt khi có push lên bất kỳ nhánh nào, hoặc khi mở/cập nhật pull request vào main
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      # Không hủy các job còn lại khi một hệ điều hành thất bại
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    defaults:
      run:
        # Ép dùng bash (có pipefail) trên cả ba hệ điều hành để câu lệnh chạy giống nhau
        shell: bash

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # cache: 'maven' lưu thư mục ~/.m2/repository vào GitHub Actions cache.
      # Khóa cache (cache key) có dạng: setup-java-<OS>-<arch>-maven-<hash của mọi pom.xml>
      # - Lần chạy đầu: không có cache (cache miss), Maven tải dependency từ Maven Central,
      #   rồi bước "Post Set up JDK" lưu cache.
      # - Các lần sau (pom.xml không đổi): khôi phục cache (cache hit), Maven không phải tải lại.
      # - Sửa pom.xml thì hash đổi, khóa cache đổi, cache cũ không dùng được nữa.
      - name: Set up JDK 17 (with Maven dependency cache)
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: 'maven'

      - name: Show environment
        run: |
          echo "Runner OS: ${{ runner.os }}"
          echo "Cache hit: ${{ steps.setup-java.outputs.cache-hit }}"
          java -version
          mvn -version

      # Mọi lệnh Maven ghi thêm vào một tệp log (tee) để cuối job đếm số artifact đã phải tải.
      # Cố ý KHÔNG dùng -ntp (--no-transfer-progress) để các dòng "Downloading from ..." vẫn hiện trong log.
      # -B: chế độ batch (log gọn); -e: in stack trace khi có lỗi.
      - name: "Phase: validate (Checkstyle)"
        run: mvn -B -e validate 2>&1 | tee -a "$RUNNER_TEMP/maven.log"

      - name: "Phase: compile"
        run: mvn -B -e compile 2>&1 | tee -a "$RUNNER_TEMP/maven.log"

      # verify gồm: test (JUnit + JaCoCo tạo báo cáo) -> package (tạo JAR) -> verify (JaCoCo check)
      - name: "Phase: verify (test + package + JaCoCo coverage check)"
        run: mvn -B -e verify 2>&1 | tee -a "$RUNNER_TEMP/maven.log"

      - name: Show log file written by tests
        if: always()
        run: |
          ls -l logs/ || true
          tail -n 20 logs/bank-system.log || true

      - name: Upload log file
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bank-system-log-${{ matrix.os }}
          path: logs/bank-system.log
          if-no-files-found: warn
          retention-days: 7

      - name: Verify the JAR
        run: |
          ls -l target/*.jar
          echo "--- Nội dung JAR ---"
          jar tf target/bank-system-*.jar
          echo "--- MANIFEST.MF ---"
          unzip -p target/bank-system-*.jar META-INF/MANIFEST.MF

      - name: Smoke test - java -jar
        run: |
          java -jar target/bank-system-*.jar
          echo "Exit code: $?"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: bank-system-jar-${{ matrix.os }}
          path: |
            target/*.jar
            target/lib/
          if-no-files-found: error
          retention-days: 7

      # Bằng chứng định lượng cho bài tối ưu: đếm số lần Maven phải tải artifact từ remote repository.
      # Cache miss: nhiều dòng "Downloading from central"; cache hit: gần như bằng 0.
      - name: Dependency download summary
        if: always()
        run: |
          LOG="$RUNNER_TEMP/maven.log"
          DOWNLOADS=$(grep -c "Downloading from" "$LOG" || true)
          {
            echo "### Maven dependency cache (${{ matrix.os }})"
            echo "- Cache hit: ${{ steps.setup-java.outputs.cache-hit }}"
            echo "- Số artifact tải từ remote repository: ${DOWNLOADS:-0}"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Coverage summary
        if: always()
        run: |
          CSV=target/site/jacoco/jacoco.csv
          if [ -f "$CSV" ]; then
            awk -F, 'NR > 1 { missed += $8; covered += $9 }
              END { printf "Line coverage (${{ matrix.os }}): %.2f%% (%d/%d lines)\n",
                100 * covered / (missed + covered), covered, missed + covered }' "$CSV" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Không có báo cáo JaCoCo (build dừng trước pha test)."
          fi

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report-${{ matrix.os }}
          path: target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

      # Chỉ chạy khi một bước ở trên thất bại: lưu báo cáo test và Checkstyle
      - name: Upload test and Checkstyle reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-reports-${{ matrix.os }}
          path: |
            target/surefire-reports/
            target/checkstyle-result.xml
          if-no-files-found: ignore
          retention-days: 7
