name: Java CI with Maven

# Kích hoạt khi có push lên bất kỳ nhánh nào, hoặc khi mở/cập nhật pull request vào main
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build, test and package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Show tool versions
        run: |
          java -version
          mvn -version

      # Các bước dưới đây chạy lần lượt từng pha của vòng đời build Maven.
      # -B: chế độ batch (log gọn, không màu); -e: in stack trace khi có lỗi.
      - name: "Phase: validate (Checkstyle)"
        run: mvn -B -e validate

      - name: "Phase: compile"
        run: mvn -B -e compile

      - name: "Phase: test (JUnit 5)"
        run: mvn -B -e test

      # Test đã chạy ở bước trước, nên bỏ qua để không chạy lại lần hai
      - name: "Phase: package"
        run: mvn -B -e package -DskipTests

      - name: Verify the JAR
        run: |
          ls -l target/*.jar
          echo "--- Nội dung JAR ---"
          jar tf target/bank-system-*.jar
          echo "--- MANIFEST.MF ---"
          unzip -p target/bank-system-*.jar META-INF/MANIFEST.MF

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: bank-system-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

      # Chỉ chạy khi một bước ở trên thất bại: lưu báo cáo để tải về phân tích
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-reports
          path: |
            target/surefire-reports/
            target/checkstyle-result.xml
          if-no-files-found: ignore
          retention-days: 7
